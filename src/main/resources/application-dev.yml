spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
  datasource:
    url: ${POSTGRESQL_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:270904}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: localhost:29092

endpoint:
  confirm-user: "http://localhost:8080/user/confirm"

open:
  api:
    title: ${API_TITLE:DUMMY-API-TITLE}
    version: 1.0.0
    description: "Presented by TanJava"
    server-url: http://localhost:8080
    server-name: Local Server Dev